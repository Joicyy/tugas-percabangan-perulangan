<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Predikat Nilai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Sistem Pengecekan Predikat Nilai</h2>
        <p class="subtitle">Tugas Pemrograman Web</p>
        
        <div class="input-section">
            <label for="inputNilai">Masukkan Nilai (pisahkan dengan koma):</label>
           <input type="text" id="inputNilai" placeholder="Maksimal 5 nilai (contoh: 85, 70, 92, 45, 60)">
            <button onclick="prosesNilai()">Cek Predikat</button>
        </div>

        <div class="output-section">
            <h3>Hasil Pengecekan:</h3>
            <div id="hasil">
            </div>
        </div>

        <footer>
            <p>&copy; 2026 | Rhesa Derian Early (25533997) - Universitas Muhammadiyah Ponorogo</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
